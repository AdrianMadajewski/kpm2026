# Renders the Manim presentation (1080p by default), publishes it on GitHub Pages
# and attaches the single-file HTML to the "html" release for download.
name: Build presentation

on:
  push:
    branches: [main]
    paths:
      - "manim/**"
      - ".github/workflows/presentation.yml"
  workflow_dispatch:
    inputs:
      quality:
        description: "Render quality (h=1080p, m=720p, l=480p)"
        default: "h"
        type: choice
        options: [h, m, l]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: manim
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (LaTeX, ffmpeg, Cairo, Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern dvisvgm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manim/requirements.txt

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render scenes and bundle them into one HTML file
        run: python build.py --quality "${{ inputs.quality || 'h' }}"

      - name: Prepare the site
        run: |
          mkdir -p site
          cp prezentacja.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: manim/site

      # A fixed release keeps a stable download link to the newest HTML (works offline).
      - name: Update the "html" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: html
          name: Slides (HTML)
          body: Newest animated slides as one offline HTML file — download and open in a browser (arrow keys to advance, T hides the timer).
          files: manim/prezentacja.html
          make_latest: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
